<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHS CompSci Portfolios</title>
  <style>
    :root {
      --bg-color: #F3EFF5;
      --card-bg: ##ECF2CF;
      --border-color: #FF739F;
      --text-main: #1E1014;
      --text-muted: #42242C;
      --accent: #B9314F;
      --accent-hover: #F7DFE4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

      body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      max-width: 600px;
    }

    header h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    .controls {
      margin-bottom: 2rem;
      width: 100%;
      max-width: 900px;
    }

    .search-bar {
      width: 100%;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #F3EFF5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .card h3 {
      color: #1E1014;
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 1.2rem;
    }

    .btn {
    display: inline-block;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    background-color: var(--bg-color);
    color: #1E1014;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    footer {
      margin-top: auto;
      padding-top: 3rem;
      color: var(--text-muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>SHS Computer Science Portfolios</h1>
    <p>Student showcase of interactive labs, profile cards, and computer science projects.</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search students..." onkeyup="filterStudents()" />
  </div>

  <main class="portfolio-grid" id="studentGrid">
    <!-- Section 1 -->
    <div class="card">
      <div class="avatar">4</div>
      <h3>Introduction to Computer Science</h3>
      <p>Period 4</p>
      <a href="./notebooks_Profile_Card_Lab.ipynb" class="btn">View Portfolio</a>
    </div>

    <!-- Section 2 -->
    <div class="card">
      <div class="avatar">8</div>
      <h3>Introduction to Computer Science</h3>
      <p>Period 8</p>
      <a href="#" class="btn">View Portfolio</a>
    </div>
  </main>

  <footer>
    <p>&copy; SHS Computer Science Department</p>
  </footer>

  <script>
    function filterStudents() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const name = card.querySelector('h3').textContent.toLowerCase();
        if (name.includes(input)) {
          card.style.display = 'flex';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
